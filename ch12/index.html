<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e5d4">
  <title>Ориентирование на местности · Полевой атлас</title>
  <link rel="stylesheet" href="../lib/engine.css">
  <style>@view-transition { navigation: none; }</style>
</head>
<body>
  <script src="../lib/engine.js"></script>
  <script src="audio/ru/timings.js?v=eleven-v4"></script>
  <script src="lesson.js"></script>
  <script>
const CHAPTER = {
  number: 12, title: 'Ориентирование на местности',
  minutes: 4, language: 'ru', lead: false,
};
const BEATS = [
  ['intro', 'Ориентиры', (m) => {
    const p = geoHeading('ПОЛЕВОЙ АТЛАС  /  § 12', 'Ориентирование на местности');
    const map = drawGeoMap(p);
    const markers = G(map.map, { o: 0 });
    [0, 1, 2, 3].forEach(i => {
      const { x, y } = stations[i];
      geoCircle(markers, x, y, 31, 'none', red, 3);
    });
    show(markers, m('landmarks'), .55);
    geoNote(p, '01', 'Найди ориентиры', ['Узнаваемые места помогают', 'определить своё положение.'], 985, 312, m('landmarks'));
    geoNote(p, '02', 'Построй маршрут', ['Найди север, измерь угол', 'и выбери следующий ориентир.'], 985, 525, m('mission'));
    const preview = G(map.routeInk, { o: 0 });
    routeTasks.slice(0, 3).forEach(([a, b]) => routeArrow(preview, a, b));
    show(preview, m('mission') + .55, .65);
  }],
  ['compass', 'Компас', (m) => {
    const p = geoHeading('01  /  СТОРОНЫ ГОРИЗОНТА', 'Как найти север');
    const compass = drawDial(p, 438, 474, { rimAngle: 65, magnetic: true, showCorners: false });
    put(compass.needle, { r: -36 });
    tw(compass.needle, { r: 0 }, .35, 1.8, soft);
    prog(q => compass.update(Math.round(65 * (1 - q))), m('align'), 2.15, soft);
    show(compass.corners, m('corners'), .55);
    geoNote(p, '1', 'Дождись остановки стрелки', ['Отмеченный конец стрелки', 'показывает примерно на север.'], 850, 305, m('needle'));
    geoNote(p, '2', 'Совмести букву «С» со стрелкой', ['Вращай корпус компаса,', 'пока отметка не совпадёт.'], 850, 467, m('align'));
    geoNote(p, '3', 'Прочитай стороны горизонта', ['Встань лицом к северу. Восток справа,', 'запад слева, юг за спиной.'], 850, 629, m('sides'));
  }],
  ['align', 'Настрой компас', () => {
    const p = geoHeading('01  /  СТОРОНЫ ГОРИЗОНТА', 'Настрой компас');
    S.geoDial = drawDial(p, 438, 475, { rimAngle: 90, magnetic: true });
  }, { dur: .5, ask: geoCompassQuiz }],
  ['azimuth', 'Азимут', (m) => {
    const p = geoHeading('02  /  НАПРАВЛЕНИЕ', 'Азимут: угол от севера');
    const dial = drawDial(p, 438, 475);
    geoNote(p, '1', 'Начни с севера', ['Север — начало отсчёта, 0°.'], 850, 307, m('north'));
    geoNote(p, '2', 'Считай по часовой стрелке', ['Восток — 90°, юг — 180°,', 'запад — 270°.'], 850, 464, m('sweep'));
    geoNote(p, '3', 'Остановись на цели', ['До северо-востока 45° —', 'половина прямого угла.'], 850, 640, m('target'));
    prog(q => dial.update(q * 90), m('sweep'), 2.1, soft);
    prog(q => dial.update(90 + q * 90), m('south'), 1.3, soft);
    prog(q => dial.update(180 + q * 90), m('west'), 1.3, soft);
    prog(q => dial.update(q * 45), m('target'), 1.5, soft);
  }],
  ['aim', 'Измерь азимут', () => {
    const p = geoHeading('02  /  НАПРАВЛЕНИЕ', 'Наведи указатель на цель');
    S.geoDial = drawDial(p, 438, 475);
    const [x, y] = dialPoint(135, 189);
    geoCircle(S.geoDial.dial, x, y, 12, gold, red, 3);
  }, { dur: .5, ask: geoAzimuthQuiz }],
  ['plan', 'План местности', (m) => {
    const p = geoHeading('03  /  ПЛАН МЕСТНОСТИ', 'Читаем план парка');
    const map = drawGeoMap(p);
    const legend = G(p, { o: 0 });
    geoLabel(legend, 'УСЛОВНЫЕ ЗНАКИ', 992, 246, pine);
    [['bridge', 'Мост'], ['tower', 'Башня'], ['tree', 'Отдельное дерево']].forEach(([kind, label], i) => {
      geoSymbol(legend, kind, 1015, 302 + 62 * i);
      geoText(legend, label, 1055, 311 + 62 * i, { size: 31 });
    });
    show(legend, m('symbols'), .45);
    const northRing = geoCircle(map.rose, 0, 0, 51, 'none', red, 3);
    put(northRing, { o: 0 });
    show(northRing, m('north'), .4);
    const scaleFrame = geoRect(map.scale, 37, 48, 172, 72, 'none', red, 12);
    put(scaleFrame, { o: 0 });
    show(scaleFrame, m('scale'), .4);
    geoNote(p, 'С', 'Прочитай стрелку и масштаб', ['Стрелка показывает север.', 'Линейка помогает узнать расстояние.'], 990, 559, m('north'));
    routeTasks.slice(0, 3).forEach(([a, b], i) => {
      const arrow = routeArrow(map.routeInk, a, b);
      put(arrow, { o: 0 });
      show(arrow, m('route') + i * .75, .5);
    });
  }],
  ['route', 'Пройди маршрут', () => {
    const p = geoHeading('03  /  ПЛАН МЕСТНОСТИ', 'Пройди маршрут');
    drawGeoMap(p);
  }, { dur: .5, ask: routeQuiz }],
  ['wrap', 'Памятка', (m) => {
    const p = geoHeading('ПОЛЕВОЙ АТЛАС  /  ПАМЯТКА', 'Три действия перед выходом');
    const map = drawGeoMap(p);
    routeTasks.slice(0, 3).forEach(([a, b]) => routeArrow(map.routeInk, a, b));
    geoNote(p, '1', 'Определи, где ты', ['Сверься с ориентирами и найди север.'], 973, 311, m('one'));
    geoNote(p, '2', 'Измерь азимут', ['Считай от севера по часовой стрелке.'], 973, 473, m('two'));
    geoNote(p, '3', 'Проверь каждый поворот', ['На новом участке измерь новый угол.'], 973, 635, m('three'));
  }],
  ['finish', 'Итог', () => {
    geoHeading('ПОЛЕВОЙ АТЛАС  /  ИТОГ', 'Маршрут завершён');
  }, { dur: .4, ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
$('bHome').href = '../index.html#ch12';
  </script>
</body>
</html>
